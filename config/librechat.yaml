version: 1.2.3
cache: true
registration:
  socialLogins: ["openid"]

endpoints:
#   anthropic:
#     apiKey: "${ANTHROPIC_API_KEY}"
#     promptCache: true
#     models:
#       - "claude-3-5-sonnet-20241022"
#     fetch: true

  custom:
    # The only LibreChat endpoint: every backend in LLM_ROUTES_JSON, listed
    # from the backends that are up with a prefix naming the source
    # (bedrock/..., ollama/..., vllm/...). Add a backend there, not here.
    # apiKey goes to backends without their own key (bedrock, vllm). The
    # X-Provost-Backend-Key-<backend> headers carry each backend's own key;
    # the proxy sends each backend only its key and strips the rest.
    - name: "Provost"
      apiKey: "${LLM_API_KEY}"
      baseURL: "http://llm-provost:8000/llm/v1"
      headers:
        X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-Cognito-User: "{{LIBRECHAT_USER_ID}}"
        X-Provost-Backend-Key-openwire: "${OPENAI_API_KEY}"
        X-Provost-Backend-Key-ollama: "${OLLAMA_API_KEY}"
      models:
        default:
          - "bedrock/${BEDROCK_MODEL}"
        fetch: true

interface:
  mcpServers:
    use: true
    create: false
    share: false
    public: false

mcpSettings:
  allowedDomains:
    - "http://llm-provost:8000"
    - "https://mcp.atlassian.com"

mcpServers:

  fhir:
    type: streamable-http
    requiresOAuth: false
    url: http://llm-provost:8000/mcp/fhir/
    headers:
      X-Cognito-User: "{{LIBRECHAT_USER_ID}}"
      X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      X-Provost-Token: "${PROVOST_TOKEN}"

  alpaca:
    type: streamable-http
    requiresOAuth: false
    url: http://llm-provost:8000/mcp/alpaca/
    headers:
      X-Cognito-User: "{{LIBRECHAT_USER_ID}}"
      X-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
      X-Provost-Token: "${PROVOST_TOKEN}"


