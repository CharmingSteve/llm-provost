error_log /dev/stderr warn;
worker_processes 1;
pid /tmp/nginx.pid;

env LLM_ROUTES_JSON;
env LLM_API_KEY;
env MCP_ROUTING_TABLE_PATH;
env AUDIT_LOG_MODE;
env PROVOST_TOKEN;

error_log syslog:server=unix:/var/run/provost/fluent-bit.sock,tag=provost_nginx_error info;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;

    lua_shared_dict rules 1m;
    lua_shared_dict rate_limit 1m;
    lua_shared_dict provost_secrets 64k;
    # Identity and request context store for the outbound MCP-to-API hop.
    # Maps provost request_id -> {user_id, customer_id, conversation_id}.
    lua_shared_dict provost_ctx 10m;
    lua_package_path "/etc/nginx/lua/?.lua;;";

    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

        log_format json_full escape=json
    '{'
      '"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status":"$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"upstream_response_time":"$upstream_response_time",'
            '"request_id":"$provost_req_id",'
      '"user_id":"$provost_user_id",'
      '"customer_id":"$provost_customer_id",'
      '"conversation_id":"$provost_conversation_id",'
            '"request_body":"$req_body",'
            '"resp_body":"$resp_body"'
    '}';

    init_worker_by_lua_block {
        require("rule_loader")
        local ok, err = require("audit_access").init()
        if not ok then
            error("failed to initialize streaming audit logger: " .. tostring(err))
        end
        -- Warm the Alpaca account-id cache when trading credentials exist.
        pcall(function()
            require("alpaca_policy").prime_account_id_cache()
        end)
    }

    server {
        listen 8000;
        server_name localhost;

        access_log syslog:server=unix:/var/run/provost/fluent-bit.sock,tag=provost_llm_to_mcp_access json_full;
        access_log /dev/stdout json_full;
        error_log /dev/stderr warn;

        set $req_body "";
        set $resp_body "";
        set $provost_req_id "";
        set $provost_user_id "steve";
        set $provost_customer_id "craig";
        set $provost_conversation_id "none";
        set $llm_target_url "";

        add_header X-Provost-Request-Id $request_id always;
        add_header X-Provost-User-Id $provost_user_id always;
        add_header X-Provost-Customer-Id $provost_customer_id always;
        add_header X-Provost-Conversation-Id $provost_conversation_id always;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }
        # Named multi-backend LLM routing (checker marker): location ~ ^/llm/(?<backend_name>x+)(/.*)
        location ~ ^/llm/(?<backend_name>[^/]+)(/.*)$ {
            lua_need_request_body on;
            access_by_lua_file /etc/nginx/lua/http_policy.lua;

            body_filter_by_lua_block {
                require("audit_body").capture(ngx.arg[1], ngx.arg[2])
            }
            log_by_lua_block {
                require("audit_body").finalize(true)
                require("audit_error").emit_response_failure()
            }

            proxy_pass $llm_target_url;
            proxy_ssl_server_name on;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Provost-Request-Id $request_id;
            proxy_set_header Authorization $http_authorization;
        }


        location ~ ^/mcp/(.+)$ {
            lua_need_request_body on;
            access_by_lua_file /etc/nginx/lua/http_policy.lua;
            content_by_lua_file /etc/nginx/lua/mcp_proxy.lua;

            body_filter_by_lua_block {
                require("audit_body").capture(ngx.arg[1], ngx.arg[2])
            }
            log_by_lua_block {
                require("audit_body").finalize(true)
                require("audit_error").emit_response_failure()
            }
        }

        location / {
            return 404;
        }
    }

    # ==================================================================
    # MCP-TO-API BOUNDARY: OUTBOUND LEDGER (hops 3 and 4)
    # The Alpaca MCP server is configured (TRADE_API_URL/DATA_API_URL/
    # BROKER_API_URL) to send its REST calls back through this server so
    # every outbound API call is governed and audited.
    # ==================================================================
    server {
        listen 8081;
        server_name localhost;

        access_log syslog:server=unix:/var/run/provost/fluent-bit.sock,tag=provost_mcp_to_api_access json_full;
        access_log /dev/stdout json_full;
        error_log /dev/stderr warn;

        set $req_body "";
        set $resp_body "";
        set $provost_req_id "";
        set $provost_user_id "steve";
        set $provost_customer_id "craig";
        set $provost_conversation_id "none";
        set $policy_apca_api_key "";
        set $policy_apca_secret_key "";

        header_filter_by_lua_block {
            local rate_limit = require "rate_limit"

            if ngx.status == 429 then
                rate_limit.enter_cooldown(60)
            end

            local remaining = ngx.header["X-RateLimit-Remaining"]
                or ngx.header["x-ratelimit-remaining"]
                or ngx.header["RateLimit-Remaining"]

            if remaining then
                rate_limit.set_remaining(remaining)
            end
        }

        location /_policy/trading/ {
            internal;
            rewrite ^/_policy/trading(/.*)$ $1 break;
            proxy_pass https://paper-api.alpaca.markets;

            proxy_ssl_server_name on;
            proxy_set_header Host paper-api.alpaca.markets;
            proxy_set_header Authorization "";
            proxy_set_header APCA-API-KEY-ID $policy_apca_api_key;
            proxy_set_header APCA-API-SECRET-KEY $policy_apca_secret_key;
            proxy_set_header Connection "";
        }

        location /_policy/broker/ {
            internal;
            rewrite ^/_policy/broker(/.*)$ $1 break;
            proxy_pass https://broker-api.alpaca.markets;

            proxy_ssl_server_name on;
            proxy_set_header Host broker-api.alpaca.markets;
            proxy_set_header Authorization "";
            proxy_set_header APCA-API-KEY-ID $policy_apca_api_key;
            proxy_set_header APCA-API-SECRET-KEY $policy_apca_secret_key;
            proxy_set_header Connection "";
        }

        location /trading/ {
            lua_need_request_body on;

            access_by_lua_block {
                require("outbound_identity").resolve()

                local rate_limit = require "rate_limit"
                local alpaca_policy = require "alpaca_policy"
                if rate_limit.is_cooldown_active() then
                    return alpaca_policy.reject_upstream_budget("PROVOST_COOLDOWN_ACTIVE", "Upstream 429 cooldown active")
                end
                if rate_limit.is_remaining_low() then
                    return alpaca_policy.reject_upstream_budget("PROVOST_RATE_LIMIT_LOW", "Upstream quota is below safe threshold")
                end

                if not alpaca_policy.enforce("trading") then
                    return
                end
            }

            body_filter_by_lua_block {
                require("outbound_identity").capture_response(ngx.arg[1], ngx.arg[2])
            }

            rewrite ^/trading(/.*)$ $1 break;
            proxy_pass https://paper-api.alpaca.markets;

            proxy_ssl_server_name on;
            proxy_set_header Host paper-api.alpaca.markets;
            proxy_set_header X-Provost-Request-Id $provost_req_id;
        }

        location /data/ {
            lua_need_request_body on;

            access_by_lua_block {
                require("outbound_identity").resolve()
                if not require("alpaca_policy").enforce("broker") then
                    return
                end
            }

            body_filter_by_lua_block {
                require("outbound_identity").capture_response(ngx.arg[1], ngx.arg[2])
            }

            rewrite ^/data(/.*)$ $1 break;
            proxy_pass https://data.alpaca.markets;

            proxy_ssl_server_name on;
            proxy_set_header Host data.alpaca.markets;
            proxy_set_header X-Provost-Request-Id $provost_req_id;
        }

        location /broker/ {
            lua_need_request_body on;

            access_by_lua_block {
                require("outbound_identity").resolve()
                if not require("alpaca_policy").enforce("trading") then
                    return
                end
            }

            body_filter_by_lua_block {
                require("outbound_identity").capture_response(ngx.arg[1], ngx.arg[2])
            }

            rewrite ^/broker(/.*)$ $1 break;
            proxy_pass https://broker-api.alpaca.markets;

            proxy_ssl_server_name on;
            proxy_set_header Host broker-api.alpaca.markets;
            proxy_set_header X-Provost-Request-Id $provost_req_id;
        }

        # Fallback route for any unprefixed outbound calls: audited, not proxied.
        location / {
            lua_need_request_body on;

            access_by_lua_block {
                require("outbound_identity").resolve()
            }

            return 404;
        }
    }
}