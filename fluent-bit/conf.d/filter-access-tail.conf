# Give tailed access lines the same envelope the syslog transport used to add
# (pri/host/ident), then hand them to the shared provost.access pipeline where
# filter-parse-access.conf expands the raw JSON line kept in "message".
[FILTER]
    Name          record_modifier
    Match         provost.tail.llm_to_mcp
    Record        ident provost_llm_to_mcp_access

[FILTER]
    Name          record_modifier
    Match         provost.tail.mcp_to_api
    Record        ident provost_mcp_to_api_access

[FILTER]
    Name          record_modifier
    Match         provost.tail.*
    Record        pri 190
    Record        host llm-provost
    Record        log_type access

[FILTER]
    Name          rewrite_tag
    Match         provost.tail.*
    Rule          $log_type ^access$ provost.access false
    Emitter_Name  tail_access
