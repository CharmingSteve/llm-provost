[INPUT]
    Name                  syslog
    Tag                   provost.raw
    Mode                  unix_udp
    Path                  /var/run/provost/fluent-bit.sock
    parser                syslog-rfc3164
    unix_perm             0666
    storage.type          filesystem
    Mem_Buf_Limit         32MB

# Finalized access records are ingested from the nginx access files, not from
# syslog: syslog datagrams drop records larger than the input buffer (and the
# kernel datagram limit), while these lines carry bodies up to 1 MB. One file
# per server so each record keeps its ident (see filter-access-tail.conf).
[INPUT]
    Name                  tail
    Tag                   provost.tail.llm_to_mcp
    Path                  /var/run/provost/llm-access.log
    Key                   message
    DB                    /var/log/fluent-bit/storage/llm-access-tail.db
    Read_from_Head        true
    Refresh_Interval      1
    # Access records carry request/response bodies (up to 64 KB raw, larger
    # after JSON escaping). The 32 KB default made tail abandon the whole
    # file on the first long record; skip only an oversized line instead.
    Buffer_Chunk_Size     64k
    Buffer_Max_Size       1M
    Skip_Long_Lines       On
    storage.type          filesystem
    Mem_Buf_Limit         32MB

[INPUT]
    Name                  tail
    Tag                   provost.tail.mcp_to_api
    Path                  /var/run/provost/mcp-api-access.log
    Key                   message
    DB                    /var/log/fluent-bit/storage/mcp-api-access-tail.db
    Read_from_Head        true
    Refresh_Interval      1
    Buffer_Chunk_Size     64k
    Buffer_Max_Size       1M
    Skip_Long_Lines       On
    storage.type          filesystem
    Mem_Buf_Limit         32MB
