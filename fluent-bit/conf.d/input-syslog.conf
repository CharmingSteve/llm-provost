[INPUT]
    Name                  syslog
    Tag                   provost.raw
    Mode                  unix_udp
    Path                  /var/run/provost/fluent-bit.sock
    parser                syslog-rfc3164
    unix_perm             0666
    storage.type          filesystem
    Mem_Buf_Limit         32MB

[INPUT]
    Name                  tail
    Tag                   provost.access
    Path                  /var/run/provost/llm-access.log
    Parser                json
    DB                    /var/log/fluent-bit/storage/llm-access-tail.db
    Read_from_Head        true
    Refresh_Interval      1
    storage.type          filesystem
    Mem_Buf_Limit         32MB