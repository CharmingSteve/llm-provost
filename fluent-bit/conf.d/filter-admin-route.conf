# Model listings (GET /llm/<backend>/v1/models, and the future aggregate
# /llm/v1/models) are UI polling, not governed events: no body, no rule
# evaluation, nothing chosen. Re-tag successful listings to provost.admin.*,
# which neither S3 nor the local file output matches; only the
# PROVOST_LOG_DEBUG stdout tee shows them. A 4xx/5xx listing is an error and
# stays provost.access. Matches the raw json_full line (kept in "message"),
# whose "request" and "status" fields are adjacent.
[FILTER]
    Name          rewrite_tag
    Match         provost.access
    Rule          $message ^\{\"time_local\":\"[^\"]*\",\"remote_addr\":\"[^\"]*\",\"request\":\"GET\s/llm/([^/\"\s?]+/)?v1/models(\?[^\"\s]*)?\sHTTP/[^\"]*\",\"status\":\"[23]\d\d\" provost.admin.models false
    Emitter_Name  admin_route
