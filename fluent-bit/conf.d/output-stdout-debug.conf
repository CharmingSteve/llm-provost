# PROVOST_LOG_DEBUG=true tee: the exact records shipped to S3, on the
# container's stdout (docker compose logs fluent-bit). Included only by
# fluent-bit-debug.conf, selected in entrypoint.sh at container start.
# Model listings (provost.admin.*) appear here and nowhere else.
[OUTPUT]
    Name      file
    Match     provost.access.*
    Path      /dev
    File      stdout
    Format    template
    Template  {schema_json}

[OUTPUT]
    Name      file
    Match     provost.error.*
    Path      /dev
    File      stdout
    Format    template
    Template  {schema_json}

[OUTPUT]
    Name      file
    Match     provost.admin.*
    Path      /dev
    File      stdout
    Format    template
    Template  {schema_json}
