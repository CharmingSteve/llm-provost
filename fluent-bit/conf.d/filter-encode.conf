# Serialize each finished record exactly once, after enrichment and hourly
# tagging. Every sink (S3, local file, debug stdout) subscribes to these same
# tags and writes the same schema_json line, so the shapes cannot diverge.
[FILTER]
    Name          lua
    Match         provost.access.*
    Script        /fluent-bit/etc/lua/encode_record.lua
    Call          encode_record

[FILTER]
    Name          lua
    Match         provost.error.*
    Script        /fluent-bit/etc/lua/encode_record.lua
    Call          encode_record
