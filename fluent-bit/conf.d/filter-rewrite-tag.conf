# Syslog carries nginx error-log audit lines only. Access records arrive via
# the access-file tail (input-syslog.conf); nginx's syslog access copies are
# not re-tagged, so each request is ingested exactly once.
[FILTER]
    Name                  rewrite_tag
    Match                 provost.raw
    Rule                  message .*PROVOST_AUDIT_ERROR.* provost.error true

[FILTER]
    Name                  rewrite_tag
    Match                 provost.direct
    Rule                  $log_type ^access$ provost.access false
    Rule                  $log_type ^error$ provost.error false
    Emitter_Name          direct_audit
